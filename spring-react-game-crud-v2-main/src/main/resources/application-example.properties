spring.application.name=gameApplication

# MySQL adatbázis beállítások
spring.datasource.url=jdbc:mysql://localhost:3307/gamedb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA beállítások
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update

# H2 konzol kikapcsolása
spring.h2.console.enabled=false